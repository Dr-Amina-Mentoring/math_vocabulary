<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Math Bridge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Zilla+Slab:wght@500;700&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: a teacher's desk — a slim header, tabbed workspaces, and the student's copy drawn on French Seyès paper (grands carreaux) with red-pen corrections. */
:root {
  --bg: #eef0f5;
  --surface: #ffffff;
  --paper: #fdfdff;
  --fg: #1c2133;
  --muted: #5b6278;
  --line: #d9dce8;
  --ink: #1f3fa6;          /* stylo bleu de l'élève */
  --pen: #c41630;          /* stylo rouge du prof */
  --pen-soft: #fbe9ec;
  --ok: #1d7a47;
  --ok-soft: #e4f4ea;
  --warn: #a35b00;
  --warn-soft: #fdf1dd;
  --seyes-fine: rgba(120, 128, 210, .16);
  --seyes-strong: rgba(110, 118, 205, .38);
  --margin-red: rgba(214, 40, 70, .55);
  --chip: #e3e6f0;
  --accent: #1f3fa6;
  --accent-fg: #ffffff;
  --accent-soft: #e9edfb;
  --on-role: #ffffff;
  --r-hyp: #2f6fb3; --r-prop: #7a3fb0; --r-calc: #3d7d6a; --r-concl: #b1462d;
  --f-display: "Zilla Slab", "Rockwell", Georgia, serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-pen: "Kalam", "Comic Sans MS", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11141d; --surface: #191d29; --paper: #1b2030; --fg: #e6e8f0; --muted: #a0a6ba; --line: #2d3347;
  --ink: #93adff; --pen: #ff7387; --pen-soft: #3a1c24; --ok: #6fd39a; --ok-soft: #173326; --warn: #f2b35c; --warn-soft: #3a2c15;
  --seyes-fine: rgba(150, 160, 255, .07); --seyes-strong: rgba(150, 160, 255, .17); --margin-red: rgba(255, 110, 130, .45);
  --chip: #262c3d; --accent: #93adff; --accent-fg: #11141d; --accent-soft: #1f2640; --on-role: #11141d;
  --r-hyp: #7fb1ec; --r-prop: #c39af0; --r-calc: #7fcfb6; --r-concl: #f29b83;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11141d; --surface: #191d29; --paper: #1b2030; --fg: #e6e8f0; --muted: #a0a6ba; --line: #2d3347;
  --ink: #93adff; --pen: #ff7387; --pen-soft: #3a1c24; --ok: #6fd39a; --ok-soft: #173326; --warn: #f2b35c; --warn-soft: #3a2c15;
  --seyes-fine: rgba(150, 160, 255, .07); --seyes-strong: rgba(150, 160, 255, .17); --margin-red: rgba(255, 110, 130, .45);
  --chip: #262c3d; --accent: #93adff; --accent-fg: #11141d; --accent-soft: #1f2640; --on-role: #11141d;
  --r-hyp: #7fb1ec; --r-prop: #c39af0; --r-calc: #7fcfb6; --r-concl: #f29b83;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible, label:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

/* bilingual help */
.en { display: none; color: var(--muted); font-size: .86em; font-style: italic; }
.show-en .en { display: block; }
.show-en span.en.inl { display: inline; }
.show-en span.en.inl::before { content: " · "; font-style: normal; }

header.top { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: end; justify-content: space-between; margin-bottom: 18px; }
.brand p { color: var(--muted); margin-top: 4px; }
.brand .mark { font-family: var(--f-pen); color: var(--pen); font-size: 1.05rem; }
.langtoggle { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.langtoggle button { border: 0; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: .9rem; }
.langtoggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

nav.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
nav.tabs button { border: 0; background: none; padding: 10px 16px 12px; color: var(--muted); font-weight: 700; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; text-align: left; }
nav.tabs button small { display: block; font-weight: 400; font-size: .78rem; }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--pen); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
.stack { display: grid; gap: 14px; }
.lead { color: var(--muted); max-width: 68ch; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 7px 14px; font-size: .9rem; text-align: left; line-height: 1.25; }
.chip b { display: block; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.enonce { border-left: 4px solid var(--accent); padding: 4px 0 4px 14px; }
.enonce .lbl, .lbl { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 4px; }

/* étiquettes */
.bank { display: grid; gap: 8px; }
.tag { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 9px 12px; font-size: .98rem; line-height: 1.35; transition: transform .12s ease, border-color .12s; }
.tag:hover { border-color: var(--ink); transform: translateX(2px); }
.tag[disabled] { opacity: .35; cursor: default; transform: none; border-style: dashed; }
.tag .en { font-size: .8rem; }

/* Seyès paper */
.copie {
  position: relative; border-radius: 4px; border: 1px solid var(--line);
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, transparent 62px, var(--margin-red) 62px, var(--margin-red) 64px, transparent 64px),
    repeating-linear-gradient(0deg, var(--seyes-strong) 0 1px, transparent 1px 32px),
    repeating-linear-gradient(0deg, var(--seyes-fine) 0 1px, transparent 1px 8px),
    repeating-linear-gradient(90deg, var(--seyes-strong) 0 1px, transparent 1px 32px);
  background-position: 0 0, 0 31px, 0 7px, 64px 0;
  padding: 32px 14px 24px 76px; min-height: 340px;
}
.copie .head { font-family: var(--f-pen); color: var(--ink); font-size: 1.05rem; line-height: 32px; margin-bottom: 0; }
.cl { position: relative; display: flex; gap: 8px; align-items: flex-start; min-height: 32px; padding: 4px 0; }
.cl .txt { flex: 1; min-width: 0; color: var(--ink); font-size: 1.02rem; line-height: 24px; overflow-wrap: anywhere; }
.cl .ctrl { display: flex; gap: 2px; flex-shrink: 0; }
.cl .ctrl button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); width: 28px; height: 28px; border-radius: 5px; font-size: .85rem; line-height: 1; padding: 0; }
.cl .ctrl button:hover { color: var(--fg); border-color: var(--fg); }
.cl .badge { position: absolute; left: -70px; top: 6px; width: 58px; text-align: right; font-family: var(--f-pen); font-size: .82rem; line-height: 1.1; }
.cl.ok .badge { color: var(--ok); }
.cl.bad .txt { text-decoration: line-through; text-decoration-color: var(--pen); text-decoration-thickness: 2px; }
.cl.bad .badge, .cl.missing .badge { color: var(--pen); }
.cl.order .badge { color: var(--warn); }
.cl.order .txt { background: var(--warn-soft); }
.pen { font-family: var(--f-pen); color: var(--pen); font-size: 1rem; line-height: 1.3; display: inline-block; width: 100%; margin-top: 2px; text-decoration: none; }
.pen .en { font-family: var(--f-body); color: var(--pen); opacity: .85; }
.pen.okc { color: var(--ok); }
.pen.warnc { color: var(--warn); }
.cl.missing { border: 2px dashed var(--pen); border-radius: 6px; padding: 4px 8px; margin: 4px 0; background: var(--pen-soft); }
.cl.missing .txt { color: var(--pen); font-family: var(--f-pen); }
.empty { color: var(--muted); font-style: italic; line-height: 32px; }
.role { display: inline-block; font-family: var(--f-body); font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; margin-right: 6px; vertical-align: 2px; color: var(--on-role); }
.role.hyp { background: var(--r-hyp); } .role.prop { background: var(--r-prop); } .role.calc { background: var(--r-calc); } .role.concl { background: var(--r-concl); }
:root[data-theme="dark"] .role { color: #11141d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .role { color: #11141d; } }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 9px 16px; border-radius: 7px; font-weight: 700; font-size: .95rem; }
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.red { background: var(--pen); color: #fff; border-color: var(--pen); }
.btn[disabled] { opacity: .5; cursor: default; }

.score { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: 8px; background: var(--pen-soft); margin-top: 14px; }
.score.good { background: var(--ok-soft); }
.score .big { font-family: var(--f-pen); font-size: 2rem; color: var(--pen); line-height: 1; transform: rotate(-4deg); border: 2px solid currentColor; border-radius: 50%; padding: 10px 12px; }
.score.good .big { color: var(--ok); }
.score .msg { flex: 1; min-width: 200px; }

/* méthode */
.algo { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 860px) { .algo { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px) { .algo { grid-template-columns: 1fr; } }
.algo .step { border-top: 4px solid; padding: 12px 12px 10px; background: var(--paper); border-radius: 0 0 8px 8px; display: grid; gap: 6px; align-content: start; }
.algo .step .n { font-family: var(--f-display); font-size: 1.6rem; line-height: 1; }
.algo .step .q { font-weight: 700; }
.algo .step code, .phrase { font-family: var(--f-body); color: var(--ink); background: var(--chip); padding: 1px 6px; border-radius: 4px; font-size: .92rem; }
.sit { display: grid; gap: 8px; }
.sit button { text-align: left; border: 1px solid var(--line); background: var(--paper); color: var(--fg); padding: 10px 12px; border-radius: 7px; }
.sit button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.tpl { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.tpl ol { margin: 8px 0 0; padding-left: 22px; display: grid; gap: 6px; color: var(--ink); }
.lex { width: 100%; border-collapse: collapse; font-size: .95rem; }
.lex th, .lex td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.lex th { font-size: .74rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.lex td:first-child { color: var(--ink); font-weight: 700; }
.tablewrap { overflow-x: auto; }
.rule { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--pen-soft); }
.rule .x { font-family: var(--f-pen); color: var(--pen); font-size: 1.4rem; line-height: 1; }

/* détective */
.dl { cursor: pointer; border-radius: 5px; }
.dl:hover .txt { background: var(--chip); }
.dl.suspect .txt { background: var(--warn-soft); box-shadow: inset 3px 0 0 var(--warn); padding-left: 6px; }
.dl.revealed { cursor: default; }
.checks { display: grid; gap: 8px; }
.checks label { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); cursor: pointer; }
.checks input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
.checks label.r-hit { border-color: var(--ok); background: var(--ok-soft); }
.checks label.r-miss { border-color: var(--pen); background: var(--pen-soft); }
.checks label.r-false { border-color: var(--warn); background: var(--warn-soft); }
.checks .res { display: block; font-size: .85rem; font-weight: 700; margin-top: 2px; }

/* rédiger */
.symbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.symbar button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); min-width: 38px; height: 36px; border-radius: 6px; font-size: 1rem; padding: 0 8px; }
.symbar button.ph { font-size: .82rem; }
textarea#draft { width: 100%; min-height: 260px; resize: vertical; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); font: 1.05rem/32px var(--f-body);
  background-color: var(--paper);
  background-image: linear-gradient(90deg, transparent 46px, var(--margin-red) 46px, var(--margin-red) 48px, transparent 48px), repeating-linear-gradient(0deg, var(--seyes-strong) 0 1px, transparent 1px 32px), repeating-linear-gradient(0deg, var(--seyes-fine) 0 1px, transparent 1px 8px);
  background-attachment: local; background-position: 0 0, 0 39px, 0 7px;
  padding: 8px 12px 8px 58px; }
.rubric { display: grid; gap: 6px; list-style: none; margin: 0; padding: 0; }
.rubric li { display: flex; gap: 10px; align-items: flex-start; padding: 7px 10px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); }
.rubric .ic { font-weight: 700; width: 18px; flex-shrink: 0; text-align: center; }
.rubric li.y .ic { color: var(--ok); } .rubric li.n .ic { color: var(--pen); } .rubric li.t { background: var(--pen-soft); border-color: var(--pen); } .rubric li.t .ic { color: var(--pen); }
.rubric .hint { display: block; font-size: .88rem; color: var(--muted); }
.ai { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 4px; display: grid; gap: 10px; }
.ai .status { color: var(--muted); font-style: italic; }
.ai details { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.ai summary { cursor: pointer; font-weight: 700; }
.ai pre { white-space: pre-wrap; font-family: var(--f-body); color: var(--ink); margin: 8px 0 0; line-height: 1.6; }
.think { border-left: 4px solid var(--r-prop); background: var(--paper); padding: 10px 12px; border-radius: 0 8px 8px 0; }
.small { font-size: .86rem; color: var(--muted); }

.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 2px; font-size: .86em; line-height: 1.1; }
.frac > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 3px; }
.frac > span:last-child { padding: 0 3px; }

/* pyramide */
.pyrgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: center; }
@media (max-width: 760px) { .pyrgrid { grid-template-columns: 1fr; } }
.pyr { display: grid; gap: 4px; width: 100%; max-width: 440px; margin: 0 auto; }
.pyr .lv { height: 62px; border: 0; padding: 6px 0 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  background: var(--rc); color: var(--on-role); font: 700 .92rem/1.1 var(--f-body); transition: opacity .15s, transform .15s; }
.pyr .lv .st { font-family: var(--f-pen); font-weight: 700; font-size: 1rem; line-height: 1; }
.pyr .lv.part { background: repeating-linear-gradient(135deg, var(--rc) 0 9px, color-mix(in srgb, var(--rc) 35%, var(--paper)) 9px 18px); }
.pyr .lv.empty { background: repeating-linear-gradient(135deg, var(--pen-soft) 0 9px, color-mix(in srgb, var(--pen) 18%, var(--paper)) 9px 18px); color: var(--pen); }
.pyr .lv.idle { background: var(--chip); color: var(--muted); }
.pyr.clickable .lv { cursor: pointer; }
.pyr.clickable .lv:not(.sel) { opacity: .5; }
.pyr.clickable .lv:hover { opacity: 1; }
.pyr .ground { border-top: 3px solid var(--fg); text-align: center; padding-top: 4px; font-family: var(--f-pen); color: var(--muted); font-size: .95rem; }
.pyr .ground.crack, .pyr .ground .crack { color: var(--pen); }
.pyr.mini { max-width: 260px; gap: 3px; }
.pyr.mini .lv { height: 40px; font-size: .74rem; padding-top: 4px; }
.pyr.mini .lv .st { font-size: .85rem; }
.pyr.mini .num { display: none; }
.pyr .lv.part .nm, .pyr .lv.part .st { background: var(--rc); padding: 0 5px; border-radius: 3px; }
.pyr .lv.empty .nm, .pyr .lv.empty .st { background: var(--pen-soft); padding: 0 5px; border-radius: 3px; }
.copie.mini { min-height: 0; padding-top: 6px; padding-bottom: 6px; }
.resrow { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; align-items: center; margin-top: 14px; }
.resrow .score { margin-top: 0; }
@media (max-width: 560px) { .resrow { grid-template-columns: 1fr; } }

/* organigramme */
.flow { display: grid; justify-items: center; }
.fn { width: 100%; max-width: 420px; text-align: center; padding: 12px 16px; background: var(--paper); border: 2px solid var(--line); border-radius: 8px; }
.fn.start { border-radius: 999px; background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 700; width: auto; padding: 8px 22px; }
.fn.start .en { color: var(--bg); opacity: .75; }
.fn.q { border-color: var(--accent); background: var(--accent-soft); position: relative; padding-top: 22px; margin-top: 12px; font-weight: 700; }
.fn.q .en { font-weight: 400; }
.fn.q.answered { opacity: .85; }
.dia { position: absolute; top: -15px; left: 50%; width: 28px; height: 28px; margin-left: -14px; transform: rotate(45deg); background: var(--accent); border-radius: 3px; display: grid; place-items: center; }
.dia b { transform: rotate(-45deg); color: var(--accent-fg); font-family: var(--f-display); }
.fn.info { border-style: dashed; border-color: var(--r-calc); font-size: .95rem; }
.fn.res { background: var(--r-prop); border-color: var(--r-prop); color: var(--on-role); font: 700 1.15rem/1.2 var(--f-display); border-radius: 14px; }
.yn { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
.yn button { border: 2px solid var(--accent); background: var(--surface); color: var(--accent); font-weight: 700; padding: 6px 22px; border-radius: 6px; }
.yn button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.answered .yn button[aria-pressed="false"] { opacity: .4; }
.arr { position: relative; width: 2px; height: 34px; background: var(--muted); }
.arr::after { content: ""; position: absolute; bottom: -1px; left: -5px; border: 6px solid transparent; border-top: 8px solid var(--muted); border-bottom: 0; }
.arr span { position: absolute; left: 10px; top: 6px; font-family: var(--f-pen); color: var(--accent); font-weight: 700; white-space: nowrap; }
.tpl.placeholder { border-style: dashed; }

[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.langtoggle .langbtn { display: inline-block; text-decoration: none; color: var(--muted); padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: .9rem; }
.langtoggle .langbtn[aria-current="true"] { background: var(--accent); color: var(--accent-fg); }
/* vocabulaire */
.vhead { display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: center; justify-content: center; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.vstats { max-width: 460px; min-width: 0; }
.vxp { font-family: var(--f-display); font-size: 1.5rem; color: var(--warn); font-weight: 700; }
.vchain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

    const a = HW[i], b = HW[i + 1], clip = `polygon(${50 - a}% 0, ${50 + a}% 0, ${50 + b}% 100%, ${50 - b}% 100%)`;
    let cls = "full", note = "";
    if (status) { const [h, t] = status[r] || [0, 0]; cls = h >= t ? "full" : h > 0 ? "part" : "empty"; note = h >= t ? "✓" : `${h}/${t}`; }
    return `<${tag} class="lv ${cls}${opts.sel === r ? " sel" : ""}" data-r="${r}" style="--rc:var(--r-${r});clip-path:${clip}"><span class="nm">${opts.mini ? LV[r].en : lvLabel(r)}</span>${note ? `<span class="st">${note}</span>` : ""}</${tag}>`;

}

/* helpers to author questions. Each returns a plain object (serialisable for the mistakes review). */
const Q = {
  info: (title, html, badge) => ({ type: "info", title, html, badge }),
  words: (title, words, intro, badge) => ({ type: "words", title, words, intro, badge }),
  mcq: (prompt, big, answer, wrongs, o = {}) => ({ type: "mcq", prompt, big, options: shuffle([answer, ...wrongs]), answer, explain: o.explain || "", speak: o.speak || "", speakAnswer: !!o.speakAnswer }),
  blank: (before, answer, after, en, wrongs, explain) => ({ type: "blank", before, after, en, options: shuffle([answer, ...wrongs]), answer, explain: explain || "" }),
  build: (en, tokens, extra) => ({ type: "build", en, answer: tokens, tiles: shuffle([...tokens, ...extra]) }),
  tap: (prompt, tokens, answer, en, explain) => ({ type: "tap", prompt, tokens, answer, en: en || "", explain: explain || "" }),
  order: (items, prompt) => ({ type: "order", prompt: prompt || "Put the proof in order", items, tiles: shuffle(items.map((x, k) => k)) }),
  level: (phrase, sub, answer, lang) => ({ type: "level", phrase, sub: sub || "", answer, lang: lang || "fr-FR" }),
  match: words => ({ type: "match", pairs: words.map(w => [w[0], w[1]]) }),
};
let ALLWORDS = []; // filled after courses are defined (for distractors)
function wordDrills(words) {
  const qs = [];
  const pool = () => ALLWORDS.length ? ALLWORDS : words;
  words.forEach((w, i) => {
    if (i % 2 === 0) qs.push(Q.mcq("What does this mean?", w[0], w[1], pick(pool().filter(x => x[1] !== w[1]), 3).map(x => x[1]), { speak: w[0] }));
    else qs.push(Q.mcq("How do you say this in French?", w[1], w[0], pick(pool().filter(x => x[0] !== w[0]), 3).map(x => x[0]), { speakAnswer: true }));
  });
  qs.push(Q.match(pick(words, Math.min(6, words.length))));
  return qs;
}
const wordsLesson = (title, words, intro) => () => [Q.words(title, words, intro, "New words"), ...wordDrills(words)];

  if (VL.mode === "lesson") P.done[VL.l.key] = true;
  addXp(gain); chime(true);
  let nextL = null;
  if (VL.mode === "lesson") { const L = allLessons(VL.l.course); nextL = L.find(l => !P.done[l.key]); }
  const dx = dayXp();
  $("#stage").innerHTML = `<div class="vles vend">
    <div class="vstamp">${perfect ? "Flawless!" : "Lesson complete!"}</div>
    <div class="vendstats"><div><b>+${gain}</b><span>XP</span></div><div><b>${VL.mistakes}</b><span>mistakes</span></div><div><b>${streakNow()}</b><span>day streak</span></div></div>
    <p class="small">${dx >= GOAL ? "Daily goal reached! 🎯".replace(" 🎯", "") : `${GOAL - dx} XP left for today's goal.`}</p>
    <div class="actions" style="justify-content:center">${nextL ? `<button class="vbtn" id="vnext">Next lesson</button>` : ""}<button class="btn" id="vback">${VL.mode === "lesson" ? "Back to the course" : "Home"}</button></div></div>`;
  const nb = $("#vnext"); if (nb) nb.onclick = () => startLesson(nextL);
  $("#vback").onclick = () => go(view.name === "all" ? view : VL && VL.mode === "lesson" ? { name: "course", id: VL.l.course.id } : { name: "home" });
}
document.addEventListener("keydown", ev => {
  if (!VL) return; const q = curQ(); if (!q) return;
  if (ev.key === "Enter") { const c = $("#vcheck"); if (c && !c.disabled) { ev.preventDefault(); c.click(); } }
  if (q.type === "mcq" && /^[1-4]$/.test(ev.key) && VL.phase === "ask") { const b = $("#stage").querySelector(`.vopt[data-k="${+ev.key - 1}"]`); if (b) b.click(); }
});

/* =================== LENIENT MARKING =================== */
const normW = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[\u2019`\u00b4]/g, "'").replace(/[\u2212\u2013\u2014]/g, "-").replace(/\u00b2/g, "2").replace(/\u2081/g, "1").replace(/\u2082/g, "2").replace(/\^/g, "")
  .replace(/(\d)[.,](\d)/g, "$1#$2").replace(/[.;:!?\u00ab\u00bb",]/g, " ").replace(/\s+/g, " ").trim();
const cmpS = s => normW(s).replace(/\s+/g, "");
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
const simR = (a, b) => { a = cmpS(a); b = cmpS(b); return (!a && !b) ? 1 : 1 - lev(a, b) / Math.max(a.length, b.length); };
function gradePart(ans, p) {
  let best = -1, model = p.variants[0];
  p.variants.forEach(v => { const r = simR(ans, v); if (r > best) { best = r; model = v; } });
  const c = cmpS(ans), keysOk = p.keys.length > 0 && p.keys.every(k => c.includes(cmpS(k)));
  const status = !c ? "miss" : best >= 0.9 ? "ok" : (best >= 0.72 || (keysOk && best >= 0.45)) ? "close" : "miss";
  const have = new Set(normW(ans).split(" "));
  const diff = model.split(/(\s+)/).map(w => { if (/^\s+$/.test(w)) return w; const n = normW(w); return !n || have.has(n) ? glossF(w) : `<mark>${esc(w)}</mark>`; }).join("");
  return { status, model, diff, exact: cmpS(ans) === cmpS(model) };
}

/* =================== ALL QUESTIONS =================== */
const TYPE_NAME = { mcq: "Choose", match: "Match", blank: "Fill the gap", build: "Build the sentence", tap: "Tap the words", level: "Pyramid floor", order: "Put in order", write: "Write" };
function qSummary(q) {
  if (q.type === "words") return `<div class="aq info"><b>New words</b><ul class="awords">${q.words.map(w => `<li><b>${esc(w[0])}</b> = ${esc(w[1])}</li>`).join("")}</ul></div>`;
  if (q.type === "info") return `<div class="aq info"><b>${esc(q.title)}</b></div>`;
  if (q.type === "idea") return `<div class="aq info"><b>Idea:</b> ${esc(LOGIC[q.u].idea)}</div>`;
  if (q.type === "bridge") { const b = BRIDGES[q.b]; return `<div class="aq info"><b>Bridge:</b> ${esc(b.enw)} = ${esc(b.w)}</div>`; }
  if (q.type === "chain") return `<div class="aq info"><b>The whole chain</b></div>`;
  let ask = "", ans = "";
  if (q.type === "mcq") { ask = `${esc(q.prompt)}${q.big ? ` <b>${gloss(q.big)}</b>` : ""}`; ans = gloss(q.answer); }
  if (q.type === "match") { ask = "Match the pairs"; ans = q.pairs.map(p => `${glossF(p[0])} = ${esc(p[1])}`).join(" · "); }
  if (q.type === "blank") { ask = `${glossF(q.before)}<span class="agap">___</span>${glossF(q.after)} <span class="small">(${esc(q.en)})</span>`; ans = glossF(q.answer); }
  if (q.type === "build") { ask = `"${esc(q.en)}"`; ans = glossF(q.answer.join(" ")); }
  if (q.type === "tap") { ask = `${esc(q.prompt)} ${glossF(q.tokens.join(" "))}`; ans = q.answer.map(k => glossF(q.tokens[k])).join(" + ") + (q.en ? ` <span class="small">(${esc(q.en)})</span>` : ""); }
  if (q.type === "level") { ask = gloss(q.phrase); ans = `Floor ${LV[q.answer].n}: ${LV[q.answer].en}`; }
  if (q.type === "order") { ask = esc(q.prompt); ans = `<ol>${q.items.map(x => `<li>${gloss(x[0])}${x[1] ? ` <span class="small">(${esc(x[1])})</span>` : ""}</li>`).join("")}</ol>`; }
  if (q.type === "write") { ask = q.en ? `"${esc(q.en)}"` : glossF(q.fr); ans = q.parts.length > 1 ? `<ol>${q.parts.map(p => `<li>${glossF(p.variants[0])}</li>`).join("")}</ol>` : glossF(q.parts[0].variants[0]); }
  return `<div class="aq"><span class="atype">${TYPE_NAME[q.type] || q.type}</span><div class="aask">${ask}</div><div class="aans">→ ${ans}</div></div>`;
}
function renderAll() {
  $("#stage").innerHTML = `<h2 class="msec">All questions</h2>
    <p class="small">Every lesson and its questions, with the answers. Some lessons pick a few questions at random, so the order or the words can change each time. You can start any lesson from here.</p>
    ${COURSES.map((c, i) => `${i === 0 ? `<h3 class="atrack">Main track · Functions</h3>` : c.track === "bonus" && COURSES[i - 1].track !== "bonus" ? `<h3 class="atrack b">Bonus · Geometry and proofs (only if there is time)</h3>` : ""}<div class="acourse"><h3 style="color:${c.color}">${esc(c.title)} · <span class="vfr">${esc(c.fr)}</span></h3>
      ${c.units.map(u => `<div class="aunit"><div class="small"><b>${esc(u.title)}</b> · ${esc(u.fr)}</div>
        ${u.lessons.map(l => `<details class="alesson" data-key="${l.key}"><summary><span>${esc(l.t)}</span>${P.done[l.key] ? `<span class="tagEN">done</span>` : ""}<button class="btn astart" data-key="${l.key}">Start</button></summary><div class="alist"></div></details>`).join("")}</div>`).join("")}</div>`).join("")}`;
  const L = COURSES.flatMap(allLessons);
  $("#stage").querySelectorAll(".alesson").forEach(d => d.addEventListener("toggle", () => {
    if (!d.open || d.dataset.filled) return; d.dataset.filled = 1;
    const l = L.find(x => x.key === d.dataset.key);
    d.querySelector(".alist").innerHTML = l.gen().map(qSummary).join("");
  }));
  $("#stage").querySelectorAll(".astart").forEach(b => b.onclick = ev => { ev.preventDefault(); startLesson(L.find(x => x.key === b.dataset.key)); });
}

/* =================== DECODER =================== */
const DKEYS = DICT.map(([fr, en]) => ({ w: (fr.match(WORD_RE) || []).filter(isWord).map(nrm), fr, en, small: fr.length <= 3 && !/[a-z]{4}/.test(fr) })).sort((a, b) => b.w.length - a.w.length);
function decode(text) {
  const toks = text.match(WORD_RE) || [], wi = toks.map((t, i) => isWord(t) ? i : -1).filter(i => i >= 0);
  const out = []; let ti = 0, k = 0, found = 0;
  while (k < wi.length) {
    let hit = null;
    for (const d of DKEYS) { if (d.w.length > wi.length - k) continue; if (d.w.every((w, j) => nrm(toks[wi[k + j]]) === w)) { hit = d; break; } }
    if (!hit) { k++; continue; }
    const s = wi[k]; let e = wi[k + hit.w.length - 1];
    if (hit.fr.endsWith(")") && toks[e + 1] === ")") e++;
    out.push(`<span class="dp">${esc(toks.slice(ti, s).join(""))}</span>`);
    const frag = toks.slice(s, e + 1).join("");
    out.push(`<span class="dg${hit.small ? " sm" : ""}" data-say="${esc(frag)}" data-lang="fr-FR" role="button" tabindex="0"><span class="dfr">${esc(frag)}</span><span class="den">${esc(hit.en)}</span></span>`);
    if (!hit.small) found++;
    ti = e + 1; k += hit.w.length;
  }
  out.push(`<span class="dp">${esc(toks.slice(ti).join(""))}</span>`);
  return { html: out.join(""), found };
}
function renderDecoder() {
  const last = store.get("decoderText", PRESETS[0]);
  $("#stage").innerHTML = `<h2 class="msec">Instruction decoder</h2>
    <p class="small">Type or paste a question from a French test. Every word the app knows gets its English meaning underneath. Tap a word to hear it.</p>
    <textarea id="dtext" class="dtext" spellcheck="false" aria-label="French instruction">${esc(last)}</textarea>
    <div class="dpres">${PRESETS.map((p, i) => `<button class="vtile small" data-p="${i}">${esc(p.length > 46 ? p.slice(0, 44) + "…" : p)}</button>`).join("")}</div>
    <div class="dout" id="dout"></div>
    <div class="vcard small">Grey words are small linking words (the, of, and…). Coloured words carry the meaning: <b>start with the action verb</b>, then what it is about, then how precise the answer must be.</div>`;
  const run = () => { const v = $("#dtext").value; store.set("decoderText", v); const r = decode(v); $("#dout").innerHTML = r.html || `<span class="small">Type something above.</span>`; wireSay($("#dout")); $("#dout").querySelectorAll(".dg").forEach(el => el.onkeydown = ev => { if (ev.key === "Enter") el.click(); }); };
  $("#dtext").addEventListener("input", run);
  $("#stage").querySelectorAll("[data-p]").forEach(b => b.onclick = () => { $("#dtext").value = PRESETS[+b.dataset.p]; run(); });
  run();
}

/* =================== GLOSSARY =================== */
function renderGlossary() {
  const groups = [];
  COURSES.forEach(c => c.units.forEach(u => {
    const ws = []; u.lessons.forEach(l => { try { l.gen().forEach(q => { if (q.type === "words") ws.push(...q.words); }); } catch (e) {} });
    const uniq = []; ws.forEach(w => { if (!uniq.some(x => x[0] === w[0])) uniq.push(w); });
    if (uniq.length) groups.push({ c, u, ws: uniq, learned: u.lessons.some(l => P.done[l.key]) });
  }));
  BRIDGES.forEach(() => {});
  groups.splice(groups.findIndex(g => g.c.id === "reason"), 0, { c: COURSE_C, u: { title: "Bridge words", fr: "Les mots-ponts" }, ws: BRIDGES.map(b => [b.w, b.enw]), learned: true });
  $("#stage").innerHTML = `<h2 class="msec">Glossary</h2><input id="gq" class="gsearch" type="search" placeholder="Search in French or English…" aria-label="Search">
    <div id="glist"></div>`;
  const draw = () => {
    const q = nrm($("#gq").value.trim());
    $("#glist").innerHTML = groups.map(g => {
      const ws = g.ws.filter(w => !q || nrm(w[0]).includes(q) || nrm(w[1]).includes(q));
      if (!ws.length) return "";
      return `<div class="gsec"><h3 style="color:${g.u.color || g.c.color}">${esc(g.u.title)} · <span class="vfr">${esc(g.u.fr)}</span> ${g.learned ? `<span class="tagEN">studied</span>` : ""}</h3>
        <div class="gtable">${ws.map(w => `<div class="grow">${sayBtn(w[0])}<b>${esc(w[0])}</b><span>${esc(w[1])}</span></div>`).join("")}</div></div>`;
    }).join("") || `<p class="small">No word found.</p>`;
    wireSay($("#glist"));
  };
  $("#gq").addEventListener("input", draw); draw();
}

go({ name: "home" });
})();
